# What this package declares about itself.
#
# The declaration is capability, not intent, and `aru doctor` compares it with
# what the code imports and calls. A package that says it makes no outbound
# calls and then holds an HTTP client is rejected, which is what makes the
# four lines below worth reading before installing anything.

name = "hyz-is/webhook"
framework = ">= 0.56"
profiles = ["conventional", "performance"]

[permissions]
# It sends webhooks: every attempt of a delivery leaves the process through
# hesape's guarded HTTP client, on a transport that refuses loopback, private,
# link-local and shared (100.64.0.0/10) addresses.
network = true
# It keeps no state outside the database.
filesystem = false
# It runs no other program.
exec = false
# module.go owns webhook_server_endpoints, webhook_server_deliveries,
# webhook_server_delivery_attempts and webhook_client_calls, so whoever
# installs this has to run `aru migrate`.
migrations = true
